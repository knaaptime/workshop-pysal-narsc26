name: workshop-pysal-narsc26
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip
  # spatial data science
  - contextily
  - esda
  - folium
  - geopandas
  - geoviews
  - giddy
  - hvplot
  - libpysal>=4.15
  - mapclassify
  - matplotlib
  - networkx
  - pyarrow
  - scikit-learn
  - seaborn
  - segregation
  - shapely
  - splot
  - spopt
  # bayesian spatial econometrics; suitesparse comes from conda-forge
  - arviz
  - formulaic
  - lazy_loader
  - polyagamma
  - pymc>=6.3
  - python-graphviz
  - scikit-sparse>=0.5
  - suitesparse
  # notebooks
  - ipywidgets
  - jupyterlab
  - nbconvert
  - watermark
  - pip:
      - jax
      - equinox
      - sparsax
      - augax
      # pinned to neighbayes==0.1.0 at release
      - neighbayes @ git+https://github.com/knaaptime/neighbayes@glossary-renames
