format:
  pdf:
    mainfont: "IBMPlexSerif"
    mainfontoptions:
      - "Path = .extra/" # relative to `output`
      - "Numbers=Proportional"
      - "Extension = .ttf"
      - "UprightFont = *-Regular"
      - "BoldFont = *-Bold"
      - "ItalicFont = *-Italic"
      - "BoldItalicFont= *-BoldItalic"
      - "Ligatures=TeX"

    sansfont: "Barlow"
    sansfontoptions:
      - "Path = .extra/"
      - "Numbers=Proportional"
      - "Numbers=OldStyle"
      - "Extension = .ttf"
      - "UprightFont = *-Regular"
      - "BoldFont = *-SemiBold"
      - "ItalicFont = *-Italic"
      - "BoldItalicFont= *-BoldItalic"
      - "Ligatures=TeX"

    monofont: "VictorMono"
    monofontoptions:
      - "Path = .extra/"
      - "ItalicFont = *-Italic"

    mathfont: "IBMPlexMath-Regular"
    mathfontoptions:
      - "Path = .extra/"
      - "Extension = .otf"

    fontsize: 12pt
    geometry: margin=1.25in